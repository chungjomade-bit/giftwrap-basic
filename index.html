<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>선물포장 기초 과정</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <span class="badge">🎁 선물포장 기초 과정</span>
      <h1>선물포장 기초 과정</h1>
      <p>기본 포장과 리본 묶기를 할 수 있게</p>
    </div>
  </header>

  <main class="wrap">
    <section>
      <h2 class="sec-title">강의 목차</h2>
      <p class="sec-desc">카드를 누르면 그 차시 페이지로 이동합니다.</p>
      <div class="cards" id="cards"></div>
    </section>

    <section>
      <h2 class="sec-title">강의 자료</h2>
      <a class="download" href="lesson-plan.pdf" download="선물포장_기초과정_교안.pdf">
        <span class="icon">📄</span>
        <span class="txt"><b>강의 교안 (PDF)</b><small>선물포장 기초 과정 교안</small></span>
        <span class="btn">다운로드</span>
      </a>
    </section>

    <section>
      <h2 class="sec-title">강의 개요</h2>
      <div class="info-grid">
        <div class="info"><div class="label">대상</div><div class="value">일반인</div></div>
        <div class="info"><div class="label">시간</div><div class="value">3시간</div></div>
        <div class="info"><div class="label">장소</div><div class="value">협회 교육장</div></div>
        <div class="info"><div class="label">목표</div>
          <ul><li>기본 포장</li><li>리본 묶기</li></ul>
        </div>
      </div>
    </section>

    <section>
      <h2 class="sec-title">준비물</h2>
      <div class="chips">
        <span class="chip">포장지</span>
        <span class="chip">리본</span>
        <span class="chip">상자</span>
        <span class="chip">가위</span>
        <span class="chip">양면테이프</span>
      </div>
    </section>
  </main>

  <footer>© 2026 선물포장 기초 과정</footer>

  <script src="data.js"></script>
  <script>
    const box = document.getElementById("cards");
    LESSONS.forEach((l, i) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = "lesson.html?no=" + (i + 1);
      a.innerHTML =
        '<span class="no' + (l.optional ? ' opt' : '') + '">' + (i + 1) + '차시' + (l.optional ? ' · 선택' : '') + '</span>' +
        '<h3>' + l.title + '</h3>' +
        '<p class="sum">' + l.summary + '</p>' +
        '<span class="go">열기 →</span>';
      box.appendChild(a);
    });
  </script>
</body>
</html>
